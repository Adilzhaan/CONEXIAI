<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      /* Backgrounds */
      --bg:            #f4f2ee;
      --bg2:           #ffffff;
      --surface:       #ffffff;
      --surface-hover: #f0ede8;

      /* Borders */
      --border:        #e5e1d8;
      --border-focus:  #c93a3a;

      /* Text */
      --text:          #141414;
      --text-muted:    #6b6b74;
      --text-dim:      #9ca3af;

      /* Accent */
      --accent:        #c93a3a;
      --accent-hover:  #a82e2e;
      --accent-light:  rgba(201,58,58,0.08);
      --accent-border: rgba(201,58,58,0.2);

      /* Status */
      --danger:        #c93a3a;
      --danger-bg:     rgba(201,58,58,0.07);
      --danger-border: rgba(201,58,58,0.22);
      --success:       #16a34a;
      --success-bg:    rgba(22,163,74,0.08);
      --success-border:rgba(22,163,74,0.22);
      --warning:       #d97706;

      /* Sidebar (dark) */
      --sb-bg:         #13151a;
      --sb-border:     rgba(255,255,255,0.07);
      --sb-text:       rgba(255,255,255,0.45);
      --sb-text-hover: rgba(255,255,255,0.85);
      --sb-active-bg:  rgba(255,255,255,0.09);
      --sb-active-text:#ffffff;
      --sb-label:      rgba(255,255,255,0.25);

      /* Radius */
      --radius:    12px;
      --radius-sm: 8px;
      --radius-xs: 6px;

      /* Shadows */
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 8px 28px rgba(0,0,0,0.10), 0 4px 8px rgba(0,0,0,0.06);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

    /* ── Auth layout ── */
    .auth-page {
      display: flex; min-height: 100vh;
    }
    .auth-left {
      flex: 1; background: var(--sb-bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 48px; min-height: 100vh;
    }
    @media(max-width:768px){ .auth-left { display:none; } }
    .auth-left-logo {
      font-size: 22px; font-weight: 800; letter-spacing: 0.06em;
      background: linear-gradient(135deg, #c93a3a, #e8734a);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 12px;
    }
    .auth-left-tagline {
      font-size: 13px; color: rgba(255,255,255,0.35); text-align: center; max-width: 260px;
    }
    .auth-left-features {
      margin-top: 48px; display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 280px;
    }
    .auth-feature {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 12px 14px;
    }
    .auth-feature-icon { font-size: 18px; flex-shrink: 0; }
    .auth-feature-text { font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.4; }
    .auth-feature-title { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.8); margin-bottom: 2px; }

    .auth-right {
      width: 480px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 48px 56px; background: var(--bg);
    }
    @media(max-width:768px){ .auth-right { width:100%; padding:32px 24px; } }
    .auth-box { width: 100%; }
    .auth-logo { margin-bottom: 32px; }
    .auth-logo-text {
      font-size: 20px; font-weight: 800; letter-spacing: 0.04em;
      background: linear-gradient(135deg, #c93a3a, #e8734a);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-logo-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

    /* ── App layout ── */
    .topbar {
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-brand {
      font-size: 15px; font-weight: 700; letter-spacing: 0.04em;
      background: linear-gradient(135deg, #c93a3a, #e8734a);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .topbar-nav { display: flex; align-items: center; gap: 16px; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 32px; }

    /* ── Sidebar layout ── */
    .sidebar-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 224px; flex-shrink: 0;
      background: var(--sb-bg);
      border-right: 1px solid var(--sb-border);
      display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh;
      overflow-y: auto;
    }
    .sidebar-logo {
      padding: 22px 18px 18px;
      border-bottom: 1px solid var(--sb-border);
    }
    .sidebar-logo-icon {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, #c93a3a, #e8734a);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: #fff;
    }
    .sidebar-logo-text {
      font-size: 12px; font-weight: 700; color: #fff;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .sidebar-logo-sub { font-size: 10px; color: var(--sb-text); margin-top: 1px; letter-spacing: 0.03em; }
    .sidebar-nav { padding: 10px 8px; flex: 1; }
    .sidebar-section-label {
      font-size: 10px; font-weight: 600; color: var(--sb-label);
      text-transform: uppercase; letter-spacing: 0.1em;
      padding: 14px 10px 5px;
    }
    .sidebar-item {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 10px; border-radius: var(--radius-xs);
      font-size: 13px; font-weight: 500; color: var(--sb-text);
      text-decoration: none; cursor: pointer;
      transition: background 0.12s, color 0.12s;
      margin-bottom: 1px;
    }
    .sidebar-item:hover { background: rgba(255,255,255,0.06); color: var(--sb-text-hover); text-decoration: none; }
    .sidebar-item.active { background: var(--sb-active-bg); color: var(--sb-active-text); font-weight: 600; }
    .sidebar-item-icon { width: 16px; text-align: center; font-size: 14px; flex-shrink: 0; opacity: 0.8; }
    .sidebar-item.active .sidebar-item-icon { opacity: 1; }
    .sidebar-content {
      flex: 1; min-width: 0; overflow-x: hidden;
      display: flex; flex-direction: column;
    }
    .sidebar-topbar {
      height: 56px; padding: 0 32px;
      background: var(--bg2); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10; flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }
    .sidebar-wrap { padding: 28px 32px; width: 100%; }
    @media(max-width:768px) {
      .sidebar { display: none; }
      .sidebar-wrap { padding: 16px 20px; }
      .sidebar-topbar { padding: 0 20px; }
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 16px;
      box-shadow: var(--shadow-sm);
    }
    .card:first-child { margin-top: 0; }
    .card-title { font-size: 14px; font-weight: 600; margin: 0 0 16px; }

    /* ── Alert ── */
    .alert {
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      margin-bottom: 14px;
      font-size: 13px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .alert-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
    .alert-error   { background: var(--danger-bg);  border: 1px solid var(--danger-border);  color: var(--danger); }
    .alert-success { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success); }
    .alert-info    { background: rgba(79,143,255,0.08); border: 1px solid rgba(79,143,255,0.22); color: #2563eb; }

    /* ── Form elements ── */
    label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text-muted); margin-bottom: 5px; letter-spacing: 0.01em;
    }
    .field { margin-bottom: 14px; }
    .field:last-of-type { margin-bottom: 0; }
    .input-wrap { position: relative; }
    input[type="text"], input[type="email"], input[type="password"], textarea, select {
      width: 100%;
      padding: 9px 13px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: #faf9f7;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--border-focus);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(201,58,58,0.08);
    }
    input::placeholder, textarea::placeholder { color: var(--text-dim); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      transition: background 0.13s, transform 0.1s, box-shadow 0.13s;
      font-family: inherit;
      text-decoration: none;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--accent); color: #fff;
      box-shadow: 0 1px 3px rgba(201,58,58,0.3);
    }
    .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 2px 6px rgba(201,58,58,0.35); text-decoration: none; color: #fff; }
    .btn-primary:disabled { background: rgba(201,58,58,0.4); cursor: not-allowed; box-shadow: none; }
    .btn-secondary {
      background: var(--bg2); color: var(--text);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .btn-secondary:hover { background: var(--surface-hover); text-decoration: none; color: var(--text); }
    .btn-ghost { background: transparent; color: var(--accent); padding: 6px 10px; }
    .btn-ghost:hover { background: var(--accent-light); text-decoration: none; }
    .btn-full { width: 100%; }
    .btn-sm { padding: 6px 11px; font-size: 12px; }
    .btn-danger {
      background: rgba(201,58,58,0.08); color: var(--danger);
      border: 1px solid var(--danger-border);
    }
    .btn-danger:hover { background: rgba(201,58,58,0.14); text-decoration: none; }

    /* ── Password toggle ── */
    .pwd-wrap { position: relative; }
    .pwd-wrap input { padding-right: 42px; }
    .pwd-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--text-muted);
      padding: 0; font-size: 15px; line-height: 1;
    }
    .pwd-toggle:hover { color: var(--text); }

    /* ── Misc ── */
    .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .divider-text { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 200px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .muted { color: var(--text-muted); }
    .small { font-size: 12px; }
    .text-center { text-align: center; }
    .mt-4  { margin-top: 4px; }  .mt-8  { margin-top: 8px; }
    .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
    .mt-20 { margin-top: 20px; }

    /* ── Badges ── */
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 600; border: 1px solid var(--border);
      background: var(--surface);
    }
    .badge-green  { background: var(--success-bg);  border-color: var(--success-border); color: var(--success); }
    .badge-yellow { background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.28); color: var(--warning); }
    .badge-blue   { background: rgba(37,99,235,0.08); border-color: rgba(37,99,235,0.22); color: #2563eb; }
    .badge-red    { background: var(--danger-bg);   border-color: var(--danger-border);  color: var(--danger); }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* ── Progress bar ── */
    #nprogress-bar {
      position: fixed; top: 0; left: 0; height: 2px;
      background: linear-gradient(90deg, #c93a3a, #e8734a, #f59e0b, #e8734a, #c93a3a);
      background-size: 300% 100%;
      z-index: 99999; width: 0%; opacity: 1;
      animation: progress-shimmer 1.5s linear infinite;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(201,58,58,0.5);
    }
    @keyframes progress-shimmer {
      0% { background-position: 100% 0; } 100% { background-position: -100% 0; }
    }

    /* ── Page overlay ── */
    #page-overlay {
      position: fixed; inset: 0;
      background: rgba(244,242,238,0);
      z-index: 9998; pointer-events: none;
      transition: background 0.25s;
      display: flex; align-items: center; justify-content: center;
    }
    #page-overlay.dimming { background: rgba(244,242,238,0.75); }
    #nav-spinner {
      display: none; flex-direction: column; align-items: center; gap: 12px;
      opacity: 0; transform: scale(0.88);
      transition: opacity 0.2s, transform 0.2s;
    }
    #nav-spinner.visible { opacity: 1; transform: scale(1); }
    .nav-spinner-ring {
      width: 40px; height: 40px;
      border: 2.5px solid rgba(201,58,58,0.12);
      border-top-color: #c93a3a; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .nav-spinner-logo {
      font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
      background: linear-gradient(135deg, #c93a3a, #e8734a);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    body.navigating * { cursor: wait !important; }

    /* ── Page enter animation ── */
    @keyframes page-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .sidebar-wrap { animation: page-in 0.3s cubic-bezier(0.23,1,0.32,1) both; }
    .wrap         { animation: page-in 0.3s cubic-bezier(0.23,1,0.32,1) both; }

    /* ── Legacy cards ── */
    .emp-card {
      padding: 13px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); margin-top: 10px;
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 12px;
      background: var(--surface);
    }
    .emp-name { font-weight: 600; font-size: 13px; }
    .emp-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .risk-card {
      padding: 15px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); margin-top: 12px;
      background: var(--surface);
    }
    .risk-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .risk-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .risk-advice { margin-top: 12px; white-space: pre-wrap; font-size: 13px; line-height: 1.6; }
    .risk-id { font-size: 10px; color: var(--text-muted); font-family: monospace; }
    .company-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 0; border-bottom: 1px solid var(--border); gap: 12px;
    }
    .company-row:last-child { border-bottom: none; padding-bottom: 0; }
    .company-row:first-child { padding-top: 0; }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">

  <div id="nprogress-bar"></div>
  <div id="page-overlay">
    <div id="nav-spinner">
      <div class="nav-spinner-ring"></div>
      <div class="nav-spinner-logo">CONEXIAI</div>
    </div>
  </div>

  {% block body %}
    {% block topbar %}{% endblock %}
    <div class="wrap">
      {% block content %}{% endblock %}
    </div>
  {% endblock %}

  <script>
  (function() {
    const bar = document.getElementById('nprogress-bar');
    const overlay = document.getElementById('page-overlay');
    let timer = null, width = 0;

    function startProgress() {
      if (timer) clearInterval(timer);
      width = 20;
      bar.style.transition = 'none';
      bar.style.width = '20%';
      bar.getBoundingClientRect();
      timer = setInterval(() => {
        if (width < 65) width += 15;
        else if (width < 85) width += 5;
        else if (width < 93) width += 1;
        bar.style.transition = 'width 0.5s ease';
        bar.style.width = width + '%';
      }, 400);
    }

    function finishProgress() {
      if (timer) { clearInterval(timer); timer = null; }
      bar.style.transition = 'width 0.2s ease';
      bar.style.width = '100%';
      setTimeout(() => {
        bar.style.transition = 'opacity 0.3s ease';
        bar.style.opacity = '0';
        setTimeout(() => {
          bar.style.transition = 'none';
          bar.style.width = '0%';
          bar.style.opacity = '1';
        }, 350);
      }, 200);
    }

    startProgress();
    window.addEventListener('load', finishProgress);
    window.addEventListener('pageshow', function(e) {
      if (e.persisted) { startProgress(); setTimeout(finishProgress, 100); }
    });

    const spinner = document.getElementById('nav-spinner');
    let spinnerTimer = null;

    function showSpinner() {
      overlay.classList.add('dimming');
      document.body.classList.add('navigating');
      spinnerTimer = setTimeout(() => {
        spinner.style.display = 'flex';
        requestAnimationFrame(() => spinner.classList.add('visible'));
      }, 120);
    }

    document.addEventListener('click', function(e) {
      const link = e.target.closest('a[href]');
      if (!link) return;
      const href = link.getAttribute('href');
      if (!href || href.startsWith('#') || href.startsWith('http') ||
          href.startsWith('mailto') || href.startsWith('javascript') ||
          link.target === '_blank' || e.metaKey || e.ctrlKey || e.shiftKey) return;
      showSpinner();
    });

    document.addEventListener('submit', function(e) {
      if (e.target.dataset.noProgress) return;
      showSpinner();
    });
  })();
  </script>

</body>
</html>
